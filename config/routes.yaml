# The agent's HTTP surface, without a base path: the host imports this file with the prefix it
# wants (`prefix: /agent`) under the firewall that resolves its principal.
odiseo_ai_conversational_agent_session_start:
    path: /session
    controller: odiseo_ai_conversational_agent.controller.session::start
    methods: [POST]

odiseo_ai_conversational_agent_chat:
    path: /chat
    controller: odiseo_ai_conversational_agent.controller.chat::chat
    methods: [POST]

odiseo_ai_conversational_agent_memory_list:
    path: /memory
    controller: odiseo_ai_conversational_agent.controller.memory::list
    methods: [GET]

odiseo_ai_conversational_agent_memory_forget:
    path: /memory/{key}
    controller: odiseo_ai_conversational_agent.controller.memory::forget
    methods: [DELETE]
    requirements:
        key: '.+'

odiseo_ai_conversational_agent_memory_clear:
    path: /memory
    controller: odiseo_ai_conversational_agent.controller.memory::clear
    methods: [DELETE]
